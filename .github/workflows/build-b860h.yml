# =============================================================
# TIrtayana OpenWrt - Build & Package for STB B860H (S905X)
# Uses ophub/amlogic-s9xxx-openwrt for final packaging
# =============================================================

name: Build TIrtayana OpenWrt for B860H

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Profile Build (all/minimal/standard/education)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - minimal
          - standard
          - education
      kernel_version:
        description: 'Overide Kernel (opsional, contoh: 6.1.y_6.6.y)'
        required: false
        default: ''
      openwrt_ip:
        description: 'IP Address default OpenWrt'
        required: false
        default: '192.168.1.1'
      rootfs_size:
        description: 'Ukuran partisi ROOTFS (MB)'
        required: false
        default: '1024'
      kernel_repo:
        description: 'Custom Kernel Repository (opsional)'
        required: false
        default: ''
      upload_release:
        description: 'Upload ke GitHub Releases?'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - openwrt-Tirtayana
    paths:
      - '.config'
      - 'feeds.conf.default'
      - 'package/**'
      - 'files/**'
      - '.github/workflows/build-b860h.yml'

env:
  TZ: Asia/Jakarta
  BUILDER_NAME: TIrtayana
  BOARD: s905x
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config

jobs:
  # ────────────────────────────────────────────
  # JOB 0: Prepare Build Matrix
  # ────────────────────────────────────────────
  prepare_matrix:
    name: 🔍 Prepare Matrix
    runs-on: ubuntu-22.04
    outputs:
      profiles: ${{ steps.set-matrix.outputs.profiles }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.build_profile }}" == "all" ] || [ -z "${{ github.event.inputs.build_profile }}" ]; then
            echo 'profiles=["minimal", "standard", "education"]' >> $GITHUB_OUTPUT
          else
            echo "profiles=[\"${{ github.event.inputs.build_profile }}\"]" >> $GITHUB_OUTPUT
          fi

  # ────────────────────────────────────────────
  # JOB 1: Build OpenWrt Generic ARM64 Rootfs
  # ────────────────────────────────────────────
  build:
    name: 🔨 Build OpenWrt (${{ matrix.profile }})
    needs: prepare_matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.prepare_matrix.outputs.profiles) }}
    outputs:
      COMPILE_STATUS: ${{ steps.compile.outputs.COMPILE_STATUS }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕐 Set Timezone
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "Build started at: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: 💾 Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -hT
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -hT

      - name: 🗄️ Cache Downloaded Packages
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('feeds.conf.default', 'package/**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex g++-multilib gawk \
            gcc-multilib gettext git genisoimage gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev

      - name: 🔧 Clone Custom Feeds & Packages
        run: |
          # Update all configured feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "✅ Feeds updated and installed"

      - name: ⚙️ Load .config
        run: |
          CONFIG_TARGET=".config.${{ matrix.profile }}"
          if [ -e "$CONFIG_TARGET" ]; then
            cp "$CONFIG_TARGET" .config
          elif [ -e "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" .config
          fi
          make defconfig
          echo "=== Active configuration summary ==="
          grep "^CONFIG_TARGET" .config
          grep "^CONFIG_PACKAGE_luci-theme" .config || true

      - name: 📁 Copy Custom Files
        run: |
          if [ -d "files" ] && [ "$(ls -A files)" ]; then
            echo "Merging files/ directory into build..."
            cp -r files/* $(pwd)/files/ 2>/dev/null || true
            echo "✅ Custom files merged"
          else
            echo "ℹ️ No custom files found in files/"
          fi

      - name: ⬇️ Download Packages
        run: |
          make download -j8 V=s
          # Remove incomplete downloads
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          echo "✅ Packages downloaded"

      - name: 🏗️ Compile OpenWrt Firmware
        id: compile
        run: |
          echo "=== Starting compilation with $(nproc) threads ==="
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "COMPILE_STATUS=success" >> $GITHUB_OUTPUT
          echo "✅ Compilation complete"

      - name: 📋 Show Compiled Outputs
        run: |
          echo "=== Compiled images ==="
          ls -lh bin/targets/armsr/armv8/ | grep -v "^total"
          echo ""
          echo "=== Manifest ==="
          cat bin/targets/armsr/armv8/*.manifest 2>/dev/null | grep -v "^kmod\|^lib" | head -50 || true

      - name: 🏷️ Generate Release Tag
        id: tag
        run: |
          TAG="B860H-${{ matrix.profile }}-$(date +%Y.%m.%d-%H%M)"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: 📤 Upload rootfs.tar.gz as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-armsr-rootfs-${{ matrix.profile }}
          path: bin/targets/armsr/armv8/*-rootfs.tar.gz
          retention-days: 1

      - name: 📤 Upload Build Info as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            bin/targets/armsr/armv8/*.manifest
            bin/targets/armsr/armv8/config.buildinfo
            bin/targets/armsr/armv8/feeds.buildinfo
          retention-days: 7

  # ────────────────────────────────────────────
  # JOB 2: Package for B860H via ophub
  # ────────────────────────────────────────────
  package:
    name: 📦 Package for B860H (${{ matrix.profile }})
    needs: [prepare_matrix, build]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.prepare_matrix.outputs.profiles) }}
    if: always()

    steps:
      - name: 📥 Download rootfs Artifact
        uses: actions/download-artifact@v4
        with:
          name: openwrt-armsr-rootfs-${{ matrix.profile }}
          path: openwrt-armsr/

      - name: 🔍 Verify rootfs file
        run: |
          echo "=== Files available for packaging ==="
          ls -lh openwrt-armsr/
          ROOTFS=$(ls openwrt-armsr/*rootfs.tar.gz 2>/dev/null | head -1)
          if [ -z "$ROOTFS" ]; then
            echo "❌ ERROR: rootfs.tar.gz not found!"
            exit 1
          fi
          echo "✅ Found: $ROOTFS"

      - name: 📦 Package OpenWrt for B860H using ophub
        uses: ophub/amlogic-s9xxx-openwrt@main
        env:
          CUSTOM_KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
        with:
          # Path ke rootfs file
          openwrt_path: openwrt-armsr/*rootfs.tar.gz
          # Board target: s905x = B860H, HG680P, dll
          openwrt_board: ${{ env.BOARD }}
          # Versi kernel yang akan digunakan (dari ophub kernel repo)
          # Logic: Jika input kosong, periksa matriks. Minimal->5.15.y, Standard->6.1.y, Education->6.6.y
          openwrt_kernel: ${{ github.event.inputs.kernel_version || (matrix.profile == 'education' && '6.6.y') || (matrix.profile == 'standard' && '6.1.y') || '5.15.y' }}
          # Otomatis pilih versi kernel terbaru dari seri yang sama
          auto_kernel: true
          # IP default router
          openwrt_ip: ${{ github.event.inputs.openwrt_ip || '192.168.1.1' }}
          # Ukuran partisi: BOOTFS/ROOTFS dalam MB
          openwrt_size: 256/${{ github.event.inputs.rootfs_size || '1024' }}
          # Nama builder untuk identifikasi
          builder_name: ${{ env.BUILDER_NAME }}_${{ matrix.profile }}

      - name: 📋 Show Packaged Outputs
        run: |
          echo "=== Packaged firmware files ==="
          ls -lh ${{ env.PACKAGED_OUTPUTPATH }}/ 2>/dev/null || echo "No output found"
          echo ""
          echo "Packaging date: ${{ env.PACKAGED_OUTPUTDATE }}"
          echo "Status: ${{ env.PACKAGED_STATUS }}"

      - name: 📤 Upload B860H Firmware as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIrtayana-OpenWrt-B860H-${{ matrix.profile }}-${{ env.PACKAGED_OUTPUTDATE }}
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*
          retention-days: 30

      - name: 🚀 Create GitHub Release
        uses: ncipollo/release-action@main
        if: |
          env.PACKAGED_STATUS == 'success' &&
          (github.event.inputs.upload_release == 'true' || github.event.inputs.upload_release == true || github.event.inputs.upload_release == '' || github.event_name == 'push')
        with:
          name: "TIrtayana OpenWrt B860H (${{ matrix.profile }}) · ${{ env.PACKAGED_OUTPUTDATE }}"
          tag: "B860H-${{ matrix.profile }}-${{ env.PACKAGED_OUTPUTDATE }}"
          artifacts: "${{ env.PACKAGED_OUTPUTPATH }}/*"
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📦 TIrtayana OpenWrt untuk STB B860H (${{ matrix.profile }})

            > Build otomatis oleh GitHub Actions

            ### 🖥️ Informasi Firmware
            | Item | Detail |
            |------|--------|
            | **Board** | STB B860H (Amlogic S905X) |
            | **Profile** | ${{ matrix.profile }} |
            | **Target** | armsr/armv8 → ophub packaged |
            | **Tema LuCI** | Argon (Modern Dark Theme) |
            | **Kernel** | Dinamis (Minimal: 5.15.y, Standard: 6.1.y, Education: 6.6.y) atau Custom |
            | **IP Default** | ${{ github.event.inputs.openwrt_ip || '192.168.1.1' }} |
            | **Username** | root |
            | **Password** | (kosong) |
            | **Tanggal Build** | ${{ env.PACKAGED_OUTPUTDATE }} |

            ### 🚀 Cara Install ke B860H
            1. Flash firmware ke **USB drive** atau **SD card** menggunakan Rufus / balenaEtcher
            2. Colok USB/SD ke STB B860H dan nyalakan
            3. Akses LuCI di `http://192.168.1.1`
            4. Login dengan username `root` (password kosong)
            5. Buka **System → Amlogic Service → Install OpenWrt**
            6. Pilih perangkat `B860H` dan klik **Install**

            ### ⚠️ Catatan Penting
            - Backup Android ROM original terlebih dahulu via `openwrt-ddbr`
            - Untuk update kernel: **System → Amlogic Service → Update Kernel**
            - File `.img.gz` diflash langsung ke USB/SD

            ### 🎨 Tema
            Menggunakan **luci-theme-argon** - tema modern dengan dukungan dark mode,
            gambar latar belakang kustom, dan tampilan yang bersih.
