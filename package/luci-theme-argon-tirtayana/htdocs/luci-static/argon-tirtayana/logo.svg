<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a6800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0b0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" stroke="#0b0b0b" stroke-width="3"/>

  <!-- Water Drop Shape -->
  <path d="M 100 40
           C 85 55, 70 75, 70 95
           C 70 115, 85 130, 100 130
           C 115 130, 130 115, 130 95
           C 130 75, 115 55, 100 40 Z"
        fill="url(#grad2)" opacity="0.8"/>

  <!-- Inner highlight on water drop -->
  <ellipse cx="92" cy="80" rx="8" ry="12" fill="rgba(255,255,255,0.3)"/>

  <!-- Wave elements at bottom -->
  <path d="M 40 140 Q 50 135 60 140 T 80 140 Q 90 135 100 140 T 120 140 Q 130 135 140 140 T 160 140"
        stroke="#0b0b0b" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 40 150 Q 50 145 60 150 T 80 150 Q 90 145 100 150 T 120 150 Q 130 145 140 150 T 160 150"
        stroke="#0b0b0b" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- Text: TIRTAYANA -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        fill="#0b0b0b" text-anchor="middle">TIRTAYANA</text>
</svg>
