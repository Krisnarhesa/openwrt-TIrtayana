# ================================================
# TIrtayana Firmware - Versi MINIMUM
# Teknologi Informasi Universitas Udayana
# ================================================

# TCP Connection - Konservatif
net.ipv4.tcp_syn_retries=3
net.ipv4.tcp_synack_retries=3
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_keepalive_time=300
net.ipv4.tcp_keepalive_intvl=15
net.ipv4.tcp_keepalive_probes=3

# TCP Buffer - Kecil, hemat RAM
net.ipv4.tcp_rmem=4096 16384 131072
net.ipv4.tcp_wmem=4096 16384 131072
net.core.rmem_max=131072
net.core.wmem_max=131072

# Network Device
net.core.netdev_budget=150

# IP Forwarding
net.ipv4.ip_forward=1

# Conntrack - Sedikit koneksi
net.netfilter.nf_conntrack_max=1024

# TCP Congestion - Reno, paling sederhana
net.ipv4.tcp_congestion_control=reno
